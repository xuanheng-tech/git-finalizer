# Small tool repository: canonical control, one integration, two feature writers.
# Existing preserved checkouts stay fenced; no automatic cleanup or publication.
schema_version = 5

[limits]
normal_limit = 4
hard_limit = 7

[canonical]
protected = true
allowed_roles = ["canonical", "control-plane", "publication", "verification"]

[slots]
integration_prepare_limit = 1
feature_or_audit = 2
emergency = 1
recovery_reserve = 1
retained = 1

[publication]
main_publish_limit = 1
remote = "origin"
branch = "main"

[release]
automatic_feature_audit = false
automatic_integration_continuation = false
preserved_auto_release = false
intent_ttl_seconds = 3600

[review]
stale_warning_days = 7

[authority]
require_adoption = true
require_task_key = true
require_authority_key = true
unique_active_feature_authority = true
