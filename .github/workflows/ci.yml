name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
          github-token: ""
      - name: Record build environment
        run: |
          python3 -V
          git --version
          tar --version
          gzip --version
          locale
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.21.0"
          github-token: ${{ github.token }}
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update -y && sudo apt-get install -y --no-install-recommends shellcheck)
      - name: Lint shell scripts
        run: just lint

      - name: Run project checks
        run: just check

      - name: Verify clean release installation on supported Python versions
        run: |
          set -euo pipefail
          for GF_TEST_PYTHON in 3.11 3.12; do
            uv run --no-project --no-config --python "$GF_TEST_PYTHON" \
              python -B -m unittest discover -s tests -p 'test_clean_install.py' -v
          done
