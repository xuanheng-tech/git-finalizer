name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The contract gate reads annotated tags (release record, version history), so a
          # depth-1 checkout cannot run it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          enable-cache: false
          github-token: ""

      - name: Record build environment
        run: |
          python3 -V
          git --version
          tar --version
          gzip --version
          locale

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.21.0"
          github-token: ""

      # Warm the linter into the build user's tool dir. Best effort on purpose: this host has seen
      # ten-minute flaky downloads here, and scripts/lint.sh resolves shellcheck itself (GF_SHELLCHECK,
      # PATH, then uvx) and fails with a remedy if nothing usable exists. The lint step stays fatal.
      - name: Install shellcheck
        continue-on-error: true
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          if ! sudo -u ubuntu -H env "PATH=/home/ubuntu/.local/bin:$PATH" \
              shellcheck --version >/dev/null 2>&1; then
            sudo -u ubuntu -H env "PATH=$PATH" uv tool install shellcheck-py
          fi
          sudo -u ubuntu -H env "PATH=/home/ubuntu/.local/bin:$PATH" \
            shellcheck --version >/dev/null

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          sudo -u ubuntu -H env "PATH=/home/ubuntu/.local/bin:$PATH" just lint

      - name: Check
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          sudo -u ubuntu -H env "PATH=$PATH" just check

      - name: Verify clean release installation on supported Python versions
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          for GF_TEST_PYTHON in 3.11 3.12; do
            sudo -u ubuntu -H env "PATH=$PATH" \
              uv run --no-project --no-config --python "$GF_TEST_PYTHON" \
              python -B -m unittest discover -s tests -p 'test_clean_install.py' -v
          done
