name: release
# Release authority, one-host-per-version, cross-host artifact parity and the first-public-release
# runbook: see docs/release-governance.md

# Gitea evaluates workflows from the pushed tag's commit; this does not backfill older commits.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# One run per tag: the publisher is a GET-then-POST, so two concurrent runs for the same tag could
# both see "no release yet" and create two.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag checkout
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF_TYPE" = "tag"
          test "$RELEASE_REF" = "refs/tags/$RELEASE_REF_NAME"
          test "$(git rev-parse 'HEAD^{commit}')" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_REF}^{commit}")" = "$RELEASE_SHA"
          test "$(git cat-file -t "$RELEASE_REF")" = "tag"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false
          github-token: ""

      - name: Record build environment
        run: |
          python3 -V
          git --version
          tar --version
          gzip --version
          locale

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.21.0"
          github-token: ""

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/release.py preflight "$RELEASE_TAG"

      # Warm the linter for the build user. Best effort: this host has seen ten-minute flaky
      # downloads here, and scripts/lint.sh resolves shellcheck itself and fails with a remedy when
      # nothing usable exists. The lint step below stays fatal.
      - name: Install shellcheck
        continue-on-error: true
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          if ! sudo -u ubuntu -H env "PATH=/home/ubuntu/.local/bin:$PATH" \
              shellcheck --version >/dev/null 2>&1; then
            sudo -u ubuntu -H env "PATH=$PATH" uv tool install shellcheck-py
          fi
          sudo -u ubuntu -H env "PATH=/home/ubuntu/.local/bin:$PATH" \
            shellcheck --version >/dev/null

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          sudo -u ubuntu -H env "PATH=/home/ubuntu/.local/bin:$PATH" just lint

      - name: Run project checks
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          sudo -u ubuntu -H env "PATH=$PATH" just check

      - name: Build deterministic release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/release.py build "$RELEASE_TAG"

      - name: Verify release package against its checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/release.py verify "$RELEASE_TAG"

      - name: Extract release notes from Changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/changelog.py extract "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md

      - name: Create Gitea Release and upload verified assets
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          def required(name: str) -> str:
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"required Actions value is missing: {name}")
              return value

          api_url = required("GITEA_API_URL").rstrip("/")
          repository = required("GITEA_REPOSITORY")
          token = required("GITEA_TOKEN")
          tag = required("RELEASE_TAG")
          commit = required("RELEASE_SHA")
          notes_path = Path("release-notes.md")
          if not notes_path.is_file():
              raise SystemExit("release notes are missing")
          notes = notes_path.read_text(encoding="utf-8").strip()
          if not notes:
              raise SystemExit("release notes are empty")
          release_url = f"{api_url}/repos/{urllib.parse.quote(repository, safe='/')}/releases"

          def origin(url: str):
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme not in {"http", "https"} or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit("release URL must be a credential-free HTTP(S) URL")
              return parsed.scheme, parsed.hostname, parsed.port or (443 if parsed.scheme == "https" else 80)

          api_origin = origin(api_url)
          web_url = api_url.removesuffix("/api/v1")
          if web_url == api_url:
              raise SystemExit("Gitea API URL must end with /api/v1")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise SystemExit("Gitea API redirect refused; configure the canonical API URL")

          class DownloadRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None and origin(newurl) != api_origin:
                      redirected.remove_header("Authorization")
                  return redirected

          api_opener = urllib.request.build_opener(NoRedirect())
          download_opener = urllib.request.build_opener(DownloadRedirect())

          def request(method: str, url: str, data: bytes | None = None, content_type: str | None = None):
              if origin(url) != api_origin:
                  raise SystemExit("Gitea API target differs from its configured origin")
              headers = {"Accept": "application/json", "Authorization": f"token {token}"}
              if content_type is not None:
                  headers["Content-Type"] = content_type
              operation = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with api_opener.open(operation, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(4096)
              except urllib.error.URLError as exc:
                  raise SystemExit("Gitea API request failed; inspect the server locally before retrying") from None

          assets = sorted(path for path in Path("dist").iterdir() if path.is_file() and not path.is_symlink())
          expected_names = {"SHA256SUMS.txt", f"git-finalizer-{tag.removeprefix('v')}.tar.gz"}
          if {asset.name for asset in assets} != expected_names:
              raise SystemExit("release assets differ from the verified package and checksum pair")
          expected_digests = {asset.name: hashlib.sha256(asset.read_bytes()).hexdigest() for asset in assets}

          tag_url = f"{release_url}/tags/{urllib.parse.quote(tag, safe='')}"
          status, _ = request("GET", tag_url)
          if status == 200:
              raise SystemExit(f"release {tag} already exists; refusing to overwrite it")
          if status != 404:
              raise SystemExit(f"unable to verify existing release state: HTTP {status}")

          payload = json.dumps(
              {
                  "tag_name": tag,
                  "target_commitish": commit,
                  "name": tag,
                  "body": notes,
                  "draft": True,
                  "prerelease": False,
              },
              separators=(",", ":"),
          ).encode()
          status, body = request("POST", release_url, payload, "application/json")
          if status != 201:
              raise SystemExit(f"unable to create draft release: HTTP {status}")
          try:
              release_id = int(json.loads(body)["id"])
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit("Gitea returned an invalid release response") from exc

          for asset in assets:
              upload_url = (
                  f"{release_url}/{release_id}/assets?"
                  + urllib.parse.urlencode({"name": asset.name})
              )
              status, body = request("POST", upload_url, asset.read_bytes(), "application/octet-stream")
              if status != 201:
                  raise SystemExit(
                      f"asset upload failed for {asset.name}: HTTP {status}; draft release retained"
                  )
              try:
                  uploaded = json.loads(body)
                  download_url = (
                      f"{web_url}/{urllib.parse.quote(repository, safe='/')}/releases/download/"
                      f"{urllib.parse.quote(tag, safe='')}/{urllib.parse.quote(asset.name, safe='')}"
                  )
                  # API and UI/attachment URLs can have different aliases. Authenticate only
                  # against the configured API origin and its exact repository/tag/asset route.
                  if (uploaded["name"] != asset.name or uploaded["size"] != asset.stat().st_size
                          or origin(download_url) != api_origin):
                      raise ValueError("asset identity or size differs")
                  operation = urllib.request.Request(download_url, headers={"Authorization": f"token {token}"})
                  with download_opener.open(operation, timeout=30) as response:
                      downloaded = response.read(asset.stat().st_size + 1)
                  if hashlib.sha256(downloaded).hexdigest() != expected_digests[asset.name]:
                      raise ValueError("downloaded bytes differ")
              except (KeyError, TypeError, ValueError, urllib.error.URLError):
                  raise SystemExit(f"asset verification failed for {asset.name}; draft release retained") from None

          status, body = request("GET", f"{release_url}/{release_id}/assets")
          try:
              listing = json.loads(body)
              if status != 200 or not isinstance(listing, list) or len(listing) != len(assets):
                  raise ValueError("asset count differs")
              if {item["name"] for item in listing} != expected_names:
                  raise ValueError("asset names differ")
          except (KeyError, TypeError, ValueError):
              raise SystemExit("release asset inventory differs; draft release retained") from None

          status, _ = request(
              "PATCH",
              f"{release_url}/{release_id}",
              b'{"draft":false}',
              "application/json",
          )
          if status != 200:
              raise SystemExit(f"unable to publish draft release: HTTP {status}")
          print(f"published_release={tag} assets={len(assets)}")
          PY
