name: release

# Gitea evaluates workflows from the pushed tag's commit; this does not backfill older commits.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag checkout
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF_TYPE" = "tag"
          test "$RELEASE_REF" = "refs/tags/$RELEASE_REF_NAME"
          test "$(git rev-parse 'HEAD^{commit}')" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_REF}^{commit}")" = "$RELEASE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: false
          github-token: ""

      - name: Install Python
        run: uv python install 3.12.13

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.21.0"
          github-token: ""

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import re

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag) is None:
              raise SystemExit(f"invalid release tag: {tag}")
          script_match = re.search(
              r'^readonly VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$',
              Path("codex-git-finalize").read_text(),
              re.MULTILINE,
          )
          readme_match = re.search(
              r"^当前版本：`([0-9]+\.[0-9]+\.[0-9]+)`$",
              Path("README.md").read_text(),
              re.MULTILINE,
          )
          if script_match is None or readme_match is None or script_match.group(1) != readme_match.group(1):
              raise SystemExit("Finalizer version declarations disagree")
          version = script_match.group(1)
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match Finalizer version {version}")
          print(f"release_version={version}")
          PY

      - name: Run project checks
        run: just check

      - name: Build deterministic release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          package=codex-git-finalizer-$version
          stage=.release-stage/$package
          rm -rf dist .release-stage
          install -d -m 0755 dist "$stage/hooks"
          install -m 0755 codex-git-finalize "$stage/codex-git-finalize"
          install -m 0644 codex-git-finalize-snapshot-verify.py "$stage/codex-git-finalize-snapshot-verify.py"
          install -m 0644 README.md CHANGELOG.md "$stage/"
          install -m 0644 \
            hooks/README.md \
            hooks/codex_git_finalize_bridge.py \
            hooks/deploy.py \
            hooks/test_codex_git_finalize_bridge.py \
            hooks/test_deploy.py \
            "$stage/hooks/"
          source_date_epoch=$(git show -s --format=%ct HEAD)
          tar --sort=name --format=ustar --owner=0 --group=0 --numeric-owner \
            --mtime="@$source_date_epoch" -C .release-stage -cf - "$package" \
            | gzip -n >"dist/$package.tar.gz"
          tar --sort=name --format=ustar --owner=0 --group=0 --numeric-owner \
            --mtime="@$source_date_epoch" -C .release-stage -cf - "$package" \
            | gzip -n >".release-stage/$package.rebuild.tar.gz"
          cmp --silent "dist/$package.tar.gz" ".release-stage/$package.rebuild.tar.gz"

      - name: Verify release package and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import tarfile

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          package = f"codex-git-finalizer-{version}"
          artifact = Path("dist") / f"{package}.tar.gz"
          expected_files = {
              f"{package}/CHANGELOG.md",
              f"{package}/README.md",
              f"{package}/codex-git-finalize",
              f"{package}/codex-git-finalize-snapshot-verify.py",
              f"{package}/hooks/README.md",
              f"{package}/hooks/codex_git_finalize_bridge.py",
              f"{package}/hooks/deploy.py",
              f"{package}/hooks/test_codex_git_finalize_bridge.py",
              f"{package}/hooks/test_deploy.py",
          }
          with tarfile.open(artifact, "r:gz") as archive:
              members = archive.getmembers()
              files = {member.name for member in members if member.isfile()}
              if files != expected_files:
                  raise SystemExit("release package file set does not match the installation contract")
              if any(
                  PurePosixPath(member.name).is_absolute()
                  or ".." in PurePosixPath(member.name).parts
                  for member in members
              ):
                  raise SystemExit("release package contains an unsafe path")
              main = archive.getmember(f"{package}/codex-git-finalize")
              if stat.S_IMODE(main.mode) != 0o755:
                  raise SystemExit("Finalizer entry point is not executable in the release package")
              stream = archive.extractfile(main)
              if stream is None:
                  raise SystemExit("Finalizer entry point is unreadable in the release package")
              match = re.search(
                  rb'^readonly VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$',
                  stream.read(),
                  re.MULTILINE,
              )
              if match is None or match.group(1).decode() != version:
                  raise SystemExit("release package contains the wrong Finalizer version")

          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          Path("dist/SHA256SUMS.txt").write_text(f"{digest}  {artifact.name}\n", encoding="utf-8")
          PY
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Extract release notes from Changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/changelog.py extract "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md

      - name: Create Gitea Release and upload verified assets
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          def required(name: str) -> str:
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"required Actions value is missing: {name}")
              return value

          api_url = required("GITEA_API_URL").rstrip("/")
          repository = required("GITEA_REPOSITORY")
          token = required("GITEA_TOKEN")
          tag = required("RELEASE_TAG")
          commit = required("RELEASE_SHA")
          notes_path = Path("release-notes.md")
          if not notes_path.is_file():
              raise SystemExit("release notes are missing")
          notes = notes_path.read_text(encoding="utf-8").strip()
          if not notes:
              raise SystemExit("release notes are empty")
          release_url = f"{api_url}/repos/{urllib.parse.quote(repository, safe='/')}/releases"

          def request(method: str, url: str, data: bytes | None = None, content_type: str | None = None):
              headers = {"Accept": "application/json", "Authorization": f"token {token}"}
              if content_type is not None:
                  headers["Content-Type"] = content_type
              operation = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(operation, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(4096)
              except urllib.error.URLError as exc:
                  raise SystemExit(f"Gitea API request failed: {exc.reason}") from exc

          tag_url = f"{release_url}/tags/{urllib.parse.quote(tag, safe='')}"
          status, _ = request("GET", tag_url)
          if status == 200:
              raise SystemExit(f"release {tag} already exists; refusing to overwrite it")
          if status != 404:
              raise SystemExit(f"unable to verify existing release state: HTTP {status}")

          payload = json.dumps(
              {
                  "tag_name": tag,
                  "target_commitish": commit,
                  "name": tag,
                  "body": notes,
                  "draft": True,
                  "prerelease": False,
              },
              separators=(",", ":"),
          ).encode()
          status, body = request("POST", release_url, payload, "application/json")
          if status != 201:
              raise SystemExit(f"unable to create draft release: HTTP {status}")
          try:
              release_id = int(json.loads(body)["id"])
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit("Gitea returned an invalid release response") from exc

          assets = sorted(path for path in Path("dist").iterdir() if path.is_file())
          if not assets:
              raise SystemExit("no release assets were produced")
          for asset in assets:
              upload_url = (
                  f"{release_url}/{release_id}/assets?"
                  + urllib.parse.urlencode({"name": asset.name})
              )
              status, _ = request("POST", upload_url, asset.read_bytes(), "application/octet-stream")
              if status != 201:
                  raise SystemExit(
                      f"asset upload failed for {asset.name}: HTTP {status}; draft release retained"
                  )

          status, _ = request(
              "PATCH",
              f"{release_url}/{release_id}",
              b'{"draft":false}',
              "application/json",
          )
          if status != 200:
              raise SystemExit(f"unable to publish draft release: HTTP {status}")
          print(f"published_release={tag} assets={len(assets)}")
          PY
