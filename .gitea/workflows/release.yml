name: release
# Release authority, one-host-per-version, cross-host artifact parity and the first-public-release
# runbook: see docs/release-governance.md

# Gitea evaluates workflows from the pushed tag's commit; this does not backfill older commits.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag checkout
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF_TYPE" = "tag"
          test "$RELEASE_REF" = "refs/tags/$RELEASE_REF_NAME"
          test "$(git rev-parse 'HEAD^{commit}')" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_REF}^{commit}")" = "$RELEASE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
          github-token: ""

      - name: Install Python
        run: uv python install 3.12.13

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.21.0"
          github-token: ""

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/release.py preflight "$RELEASE_TAG"

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          sudo -u ubuntu -H env "PATH=$PATH" just lint

      - name: Run project checks
        run: |
          set -euo pipefail
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"
          sudo -u ubuntu -H env "PATH=$PATH" just check

      - name: Build deterministic release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/release.py build "$RELEASE_TAG"

      - name: Verify release package and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/release.py verify "$RELEASE_TAG"

      - name: Extract release notes from Changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 -B scripts/changelog.py extract "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md

      - name: Create Gitea Release and upload verified assets
        env:
          GITEA_API_URL: ${{ github.api_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          def required(name: str) -> str:
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"required Actions value is missing: {name}")
              return value

          api_url = required("GITEA_API_URL").rstrip("/")
          repository = required("GITEA_REPOSITORY")
          token = required("GITEA_TOKEN")
          tag = required("RELEASE_TAG")
          commit = required("RELEASE_SHA")
          notes_path = Path("release-notes.md")
          if not notes_path.is_file():
              raise SystemExit("release notes are missing")
          notes = notes_path.read_text(encoding="utf-8").strip()
          if not notes:
              raise SystemExit("release notes are empty")
          release_url = f"{api_url}/repos/{urllib.parse.quote(repository, safe='/')}/releases"

          def request(method: str, url: str, data: bytes | None = None, content_type: str | None = None):
              headers = {"Accept": "application/json", "Authorization": f"token {token}"}
              if content_type is not None:
                  headers["Content-Type"] = content_type
              operation = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(operation, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(4096)
              except urllib.error.URLError as exc:
                  raise SystemExit(f"Gitea API request failed: {exc.reason}") from exc

          tag_url = f"{release_url}/tags/{urllib.parse.quote(tag, safe='')}"
          status, _ = request("GET", tag_url)
          if status == 200:
              raise SystemExit(f"release {tag} already exists; refusing to overwrite it")
          if status != 404:
              raise SystemExit(f"unable to verify existing release state: HTTP {status}")

          payload = json.dumps(
              {
                  "tag_name": tag,
                  "target_commitish": commit,
                  "name": tag,
                  "body": notes,
                  "draft": True,
                  "prerelease": False,
              },
              separators=(",", ":"),
          ).encode()
          status, body = request("POST", release_url, payload, "application/json")
          if status != 201:
              raise SystemExit(f"unable to create draft release: HTTP {status}")
          try:
              release_id = int(json.loads(body)["id"])
          except (KeyError, TypeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit("Gitea returned an invalid release response") from exc

          assets = sorted(path for path in Path("dist").iterdir() if path.is_file())
          if not assets:
              raise SystemExit("no release assets were produced")
          for asset in assets:
              upload_url = (
                  f"{release_url}/{release_id}/assets?"
                  + urllib.parse.urlencode({"name": asset.name})
              )
              status, _ = request("POST", upload_url, asset.read_bytes(), "application/octet-stream")
              if status != 201:
                  raise SystemExit(
                      f"asset upload failed for {asset.name}: HTTP {status}; draft release retained"
                  )

          status, _ = request(
              "PATCH",
              f"{release_url}/{release_id}",
              b'{"draft":false}',
              "application/json",
          )
          if status != 200:
              raise SystemExit(f"unable to publish draft release: HTTP {status}")
          print(f"published_release={tag} assets={len(assets)}")
          PY
